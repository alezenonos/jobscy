name: CI

on:
  push:
    branches: [master, "claude/*"]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv lock --check
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest --cov=. --cov-report=term-missing --cov-fail-under=60 --cov-config=pyproject.toml -v

  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - name: Check the published data (rebuilds, totals, ranges, freshness)
        run: uv run pytest tests/test_data_integrity.py tests/test_site_data.py -v
      - name: Validate vercel.json
        run: python -c "import json; json.load(open('vercel.json')); print('OK: vercel.json is valid JSON')"
